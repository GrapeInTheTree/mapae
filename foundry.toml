[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]

solc_version = "0.8.29"          # matches GIWA Blockscout: v0.8.29+commit.ab55807c
evm_version = "cancun"           # GIWA runs Osaka; cancun is the safe verified floor
optimizer = true
optimizer_runs = 1_000           # deploy size + verification stability
via_ir = false                   # DO NOT ENABLE - breaks Blockscout verification
bytecode_hash = "none"
cbor_metadata = false
verbosity = 2
fs_permissions = [
    {access = "read-write", path = "./deployments"},
    {access = "read-write", path = "./test/fixtures"},
]

[profile.ci]
fuzz = {runs = 5_000}
invariant = {runs = 1_000, depth = 256, fail_on_revert = false}

[profile.lite]
optimizer = false
fuzz = {runs = 50}
invariant = {runs = 10, depth = 32}

[lint]
# mixed-case-function: Dojang's external names (payAndIssueEAS, revokeEAS) are fixed by the
#   deployed contract; our interfaces mirror them verbatim and cannot rename them.
# asm-keccak256: EncoderLib is byte-for-byte identical to MetaMask's delegation-framework so that
#   delegations are portable between the two managers. Hand-rolling the hashing in assembly would
#   save gas and risk exactly the drift the whole compatibility claim rests on.
exclude_lints = ["mixed-case-function", "asm-keccak256"]

[rpc_endpoints]
giwa_sepolia = "${GIWA_SEPOLIA_RPC_URL}"

# NOTE: no [etherscan] section on purpose. Declaring chain 91342 there makes forge resolve it
# against the named-chain registry and `forge script --broadcast` dies with "Chain 91342 not
# supported" BEFORE broadcasting (the dry-run still writes deployments/*.json, which is how that
# failure masquerades as success - always verify code on-chain after deploying). Verification is
# done explicitly:
#   forge verify-contract <addr> <path:Name> --verifier blockscout \
#     --verifier-url https://sepolia-explorer.giwa.io/api/

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
multiline_func_header = "attributes_first"
wrap_comments = true
